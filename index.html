<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font-family: monospace;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        pre {
            font-size: clamp(8px, 1.5vw, 16px);
            line-height: 1.2;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 12px;
        }

        p {
            color: #999;
            font-size: 16px;
            margin: 0;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background: #eee;
            margin-left: 4px;
            animation: blink 1s steps(1) infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        

        <h1>Website Under Construction<span class="cursor"></span></h1>
        <p>Something awesome is being built.</p>

    </div>
</body>
</html>
